[package]
name = "swarmlink-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Swarmlink agent: runs on each robot, executes commands from the control host"

[[bin]]
name = "swarmlink-agent"
path = "src/main.rs"

[dependencies]
swarmlink-core.workspace = true
swarmlink-proto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = { workspace = true }
chrono.workspace = true
anyhow.workspace = true
clap.workspace = true
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
libc = "0.2"
tokio-stream.workspace = true
futures-util.workspace = true
