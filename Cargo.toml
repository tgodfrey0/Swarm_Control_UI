[workspace]
resolver = "2"
members = [
    "proto",
    "crates/core",
    "crates/host",
    "crates/agent",
    "crates/client",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Swarmlink contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tonic = "0.14"
reqwest = { version = "0.13", features = ["json"] }
tokio-stream = "0.1"
futures-util = "0.3"
tokio-tungstenite = "0.26"

swarmlink-core = { path = "crates/core" }
swarmlink-proto = { path = "proto" }
swarmlink-client = { path = "crates/client" }
