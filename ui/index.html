<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwarmDeck</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    // Apply the saved (or OS-preferred) theme before first paint to avoid a flash.
    (function () {
      var t = "dark";
      try {
        t = localStorage.getItem("theme") ||
          (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo logo-light" src="/static/logo-light.svg" alt="SwarmDeck">
      <img class="logo logo-dark" src="/static/logo-dark.svg" alt="SwarmDeck">
      <h1><span class="controller" id="controller-name"></span></h1>
    </div>
    <div class="header-right">
      <button id="clear-all" type="button" class="clear-btn" title="Clear all logs and run history">Clear Logs &amp; Runs</button>
      <button id="theme-toggle" type="button" class="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div id="conn" class="conn connecting">connecting…</div>
    </div>
  </header>

  <main>
    <section id="swarm">
      <h2>Swarm</h2>
      <div id="robots" class="grid"></div>
    </section>

    <aside>
      <section>
        <h2>Dispatch</h2>
        <form id="run-form" autocomplete="off">
          <label>Action
            <select id="run-action" required>
              <option value="">choose an action…</option>
            </select>
          </label>
          <label>Targets
            <select id="run-targets" name="targets">
              <option value="all">-- all robots --</option>
              <optgroup label="Robot types" id="run-type-opts"></optgroup>
              <optgroup label="Robots" id="run-robot-opts"></optgroup>
              <option value="custom">custom list…</option>
            </select>
          </label>
          <label id="run-robots-label" hidden>Robots (comma-separated)
            <input id="run-robots" type="text" placeholder="tb-01,tb-02">
          </label>
          <label>Timeout override (s, 0 = config)
            <input id="run-timeout" type="number" min="0" value="0">
          </label>
          <button type="submit" id="run-submit">Run</button>
          <div id="run-result" class="result"></div>
        </form>
      </section>

      <section>
        <h2>Recent runs</h2>
        <div id="runs"></div>
      </section>
    </aside>

    <section id="logs">
      <h2>Logs
        <span id="log-robot" class="muted"></span>
        <button id="log-follow" type="button" title="Toggle auto-scroll to newest lines">following…</button>
        <button id="log-copy" type="button" title="Copy visible log lines to the clipboard">Copy</button>
        <button id="log-download" type="button" title="Download visible log lines as a text file">Download</button>
      </h2>
      <div id="log-view" class="log"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title">Error</h3>
      <p id="modal-text"></p>
      <button id="modal-close" type="button">OK</button>
      <button id="modal-cancel" type="button" hidden>Cancel</button>
    </div>
  </div>
</body>
</html>
