# SwarmDeck — pixi-managed dev/build environment.
#
# Rust itself comes from rustup (see activate.sh): conda-forge rust ships no
# standard libraries for other targets, so it cannot cross-compile. Pixi
# manages every other tool (protobuf, zig, cargo-zigbuild, ssh, ...) so the
# environment is reproducible across Linux/macOS/Windows.

[workspace]
name = "swarmdeck"
version = "0.1.0"
description = "Config-driven swarm robotics control deck: WebUI + CLI + robot agents"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[activation]
scripts = ["activate.sh"]

[dependencies]
protobuf = "*"
openssl = "*"
zig = "*"
cargo-zigbuild = "*"
sccache = "*"
ca-certificates = "*"

# ssh/scp are used by the provisioner and are only packaged for unix hosts.
[target.linux-64.dependencies]
openssh = "*"

[target.osx-64.dependencies]
openssh = "*"

[target.osx-arm64.dependencies]
openssh = "*"

[tasks]
# --- development ------------------------------------------------------------
host = { cmd = "cargo run -p swarmdeck-host --", description = "Run the control host (defaults to configs/lab). Pass args after `--`, e.g. `pixi run host -- --swarm configs/sim`." }
agent = { cmd = "cargo run -p swarmdeck-agent --", description = "Run a robot agent (default config /etc/swarm-agent/agent.toml). Pass `--config <path>` to override." }
agent-sim = { cmd = "cargo run -p swarmdeck-agent --", description = "Run a simulated robot agent locally. Pass `--config <agent.toml>`, e.g. `pixi run agent-sim -- --config configs/sim/agent-1.toml`." }
cli = { cmd = "cargo run -p swarmdeck-cli --", description = "Run the CLI; pass the subcommand after `--`, e.g. `pixi run cli -- status`." }

fmt = { cmd = "cargo fmt --all", description = "Format all Rust code (cargo fmt --all)." }
lint = { cmd = "cargo clippy --workspace --all-targets -- -D warnings", description = "Lint the whole workspace, deny all warnings (cargo clippy -D warnings)." }
test = { depends-on = ["test-rust", "test-webui"], description = "Run all tests: Rust workspace tests + WebUI contract test." }
test-rust = { cmd = "cargo test --workspace", description = "Run all workspace unit tests." }
test-webui = { cmd = "node ui/test/contract.test.js", description = "WebUI contract test: loads the real app.js against docs/api.md fixtures." }
check = { cmd = "cargo check --workspace", description = "Type-check the workspace without building binaries." }

# --- cross-compile the agent (static musl, no glibc deps) -------------------
# Primary target for Raspberry Pi / Jetson running 64-bit OS.
agent-aarch64 = { cmd = "cargo zigbuild -p swarmdeck-agent --release --target aarch64-unknown-linux-musl", description = "Cross-compile a static musl agent for aarch64 Linux (RPi / Jetson, 64-bit OS)." }
# 32-bit Raspberry Pi OS fallback.
agent-armv7 = { cmd = "cargo zigbuild -p swarmdeck-agent --release --target armv7-unknown-linux-musleabihf", description = "Cross-compile a static musl agent for armv7 Linux (32-bit Raspberry Pi OS)." }
# x86_64 robots / SBCs.
agent-x86_64 = { cmd = "cargo zigbuild -p swarmdeck-agent --release --target x86_64-unknown-linux-musl", description = "Cross-compile a static musl agent for x86_64 Linux (SBCs / laptops)." }
agent-all = { depends-on = ["agent-aarch64", "agent-armv7", "agent-x86_64"], description = "Cross-compile the static agent for all three targets (aarch64 + armv7 + x86_64)." }

# --- provisioning -----------------------------------------------------------
# Push the agent to all configured robots over ssh and install the systemd unit.
provision = { cmd = "cargo run -p swarmdeck-cli -- provision", description = "SSH-provision the agent onto robots (defaults to configs/lab). Pass args after `--`, e.g. `pixi run provision -- --robots tb-01 --user pi`." }
