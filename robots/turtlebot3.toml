# TurtleBot3 ground robots (used with a ROS2-based controller).
# Robot types are shared across swarms and merged from this directory by
# default (`--robot-types robots`).

[robot_types.turtlebot3]
display_name = "TurtleBot3"

[robot_types.turtlebot3.actions.bringup]
command = "ros2 launch turtlebot3_bringup turtlebot3_core.launch.py"
timeout_sec = 120
dangerous = false
background = true

[robot_types.turtlebot3.actions.shutdown]
command = "sudo shutdown -h now"
dangerous = true
