<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <polygon id="hex-node" points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20" />
    <polygon id="hex-inner" points="0,-22 19.05,-11 19.05,11 0,22 -19.05,11 -19.05,-11" />
  </defs>

  <g transform="translate(250, 250)">
    <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="0" y1="0" x2="129.9" y2="-75"/>
      <line x1="0" y1="0" x2="129.9" y2="75"/>
      <line x1="0" y1="0" x2="0" y2="150"/>
      <line x1="0" y1="0" x2="-129.9" y2="75"/>
      <line x1="0" y1="0" x2="-129.9" y2="-75"/>
      <polygon points="0,-150 129.9,-75 129.9,75 0,150 -129.9,75 -129.9,-75"/>
    </g>

    <g fill="#FFFFFF">
      <g transform="translate(0, -150)">
        <use href="#hex-node"/>
        <use href="#hex-inner" fill="#1e2227"/>
      </g>
      <g transform="translate(129.9, -75)">
        <use href="#hex-node"/>
        <use href="#hex-inner" fill="#1e2227"/>
      </g>
      <g transform="translate(129.9, 75)">
        <use href="#hex-node"/>
        <use href="#hex-inner" fill="#1e2227"/>
      </g>
      <g transform="translate(0, 150)">
        <use href="#hex-node"/>
        <use href="#hex-inner" fill="#1e2227"/>
      </g>
      <g transform="translate(-129.9, 75)">
        <use href="#hex-node"/>
        <use href="#hex-inner" fill="#1e2227"/>
      </g>
      <g transform="translate(-129.9, -75)">
        <use href="#hex-node"/>
        <use href="#hex-inner" fill="#1e2227"/>
      </g>
    </g>

    <g transform="translate(0, 0)">
      <polygon points="0,-48 41.57,-24 41.57,24 0,48 -41.57,24 -41.57,-24" fill="#1d70b8" />
      <polygon points="0,-34 29.44,-17 29.44,17 0,34 -29.44,17 -29.44,-17" fill="transparent" />
      <polygon points="0,-22 19.05,-11 19.05,11 0,22 -19.05,11 -19.05,-11" fill="#1d70b8" />
    </g>
  </g>
</svg>
